[package]
name = "vrclogger-core"
description = "VRChat log parser, SQLite importer, query layer and HTML viewer exporter"
edition.workspace = true
version.workspace = true

[lib]
name = "vrclogger_core"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
