[package]
name = "yorimichi-core"
description = "Yorimichi for VRChat core: VRChat log parser, SQLite importer, query layer and HTML viewer exporter"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "yorimichi_core"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
walkdir = "2"
jpeg-decoder = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
