[package]
name = "vrclogger"
description = "VRChat log viewer"
edition.workspace = true
version.workspace = true

[lib]
name = "vrclogger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vrclogger"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vrclogger-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
velopack = "1.3.39-g8d2844f"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
arboard = "3"
dirs = "6"
tokio = { version = "1", features = ["time", "sync"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com"]

[dev-dependencies]
tempfile = "3"
